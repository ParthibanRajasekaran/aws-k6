name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID || 'test' }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY || 'test' }}
      AWS_REGION: us-east-1
    services:
      localstack:
        image: localstack/localstack:latest
        ports:
          - 4566:4566
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      
      - name: Configure AWS credentials for LocalStack
        run: |
          aws configure set aws_access_key_id test
          aws configure set aws_secret_access_key test  
          aws configure set region us-east-1
          aws configure set output json
      - name: Install dependencies
        run: |
          for i in 1 2 3; do
            npm ci && break || {
              echo "npm ci failed (attempt $i), printing npm-debug.log if exists...";
              if [ -f npm-debug.log ]; then cat npm-debug.log; fi;
              if [ $i -eq 3 ]; then exit 1; fi;
              echo "Retrying in 10 seconds...";
              sleep 10;
            }
          done
      - name: Start LocalStack and create S3 bucket
        run: |
          echo "Waiting for LocalStack to be ready..."
          # Wait for LocalStack to be fully ready
          for i in {1..30}; do
            if curl -s http://localhost:4566/_localstack/health | grep -q '"s3": "available"'; then
              echo "LocalStack is ready!"
              break
            fi
            echo "Waiting for LocalStack... (attempt $i/30)"
            sleep 2
          done
          # Create S3 bucket
          aws --endpoint-url=http://localhost:4566 s3 mb s3://grocery-list-bucket || true
          # Verify bucket was created
          aws --endpoint-url=http://localhost:4566 s3 ls
      - name: Download Karate JAR
        run: |
          curl -L -o karate.jar https://github.com/karatelabs/karate/releases/download/v1.4.1/karate-1.4.1.jar
      - name: Setup AWS SAM CLI
        uses: aws-actions/setup-sam@v1
      - name: Create CI-specific environment file
        run: |
          echo "Creating environment file for CI with correct LocalStack endpoint..."
          cat > env.json << EOF
          {
            "GroceryHandler": {
              "GROCERY_BUCKET": "grocery-list-bucket",
              "AWS_ACCESS_KEY_ID": "test",
              "AWS_SECRET_ACCESS_KEY": "test",
              "AWS_REGION": "us-east-1",
              "AWS_ENDPOINT_URL": "http://localhost:4566",
              "AWS_DEFAULT_REGION": "us-east-1"
            }
          }
          EOF
          cat env.json
          
          # Also create a local .env file for debugging
          cat > .env << EOF
          GROCERY_BUCKET=grocery-list-bucket
          AWS_ACCESS_KEY_ID=test
          AWS_SECRET_ACCESS_KEY=test
          AWS_REGION=us-east-1
          AWS_ENDPOINT_URL=http://localhost:4566
          AWS_DEFAULT_REGION=us-east-1
          EOF
      
      - name: Build SAM application
        run: |
          echo "Building SAM application..."
          sam build --debug
          echo "SAM build completed"
      
      - name: Start API Gateway simulation and run tests
        run: |
          echo "Starting API Gateway simulation in background..."
          # Export environment variables to ensure they're available to sam local
          export GROCERY_BUCKET=grocery-list-bucket
          export AWS_ACCESS_KEY_ID=test
          export AWS_SECRET_ACCESS_KEY=test
          export AWS_REGION=us-east-1
          export AWS_ENDPOINT_URL=http://localhost:4566
          export AWS_DEFAULT_REGION=us-east-1
          
          # Start the API Gateway simulation in background without using & to prevent job termination
          # npm run start:ci will use SAM CLI to start the API gateway locally
          npm run start:ci &
          SAM_PID=$!
          echo "SAM process started with PID: $SAM_PID"
          # Give the server time to start and check if process is still running
          echo "Sleeping for 20 seconds to allow API simulation to start..."
          sleep 20
          if ps -p $SAM_PID > /dev/null; then
            echo "SAM process is still running (PID: $SAM_PID)"
          else
            echo "SAM process died! Checking for errors..."
            # Try to see if there are any docker containers
            docker ps -a
            exit 1
          fi
          
          # Test the health endpoint first
          echo "Testing health endpoint..."
          curl -f http://localhost:3000/grocery -X GET || {
            echo "Health endpoint failed!"
            exit 1
          }
          
          # Verify LocalStack is still healthy
          curl -s http://localhost:4566/_localstack/health || {
            echo "LocalStack health check failed!"
            docker logs $(docker ps -q --filter ancestor=localstack/localstack:latest) 2>/dev/null || true
            exit 1
          }
          
          # Execute full test suite; test-all.sh includes a wait-for-url step
          ./scripts/test-all.sh
        env:
          AWS_ENDPOINT_URL: http://localhost:4566
          AWS_ACCESS_KEY_ID: test
          AWS_SECRET_ACCESS_KEY: test
          AWS_REGION: us-east-1
          AWS_DEFAULT_REGION: us-east-1
          GROCERY_BUCKET: grocery-list-bucket
      - name: Print API Gateway simulation logs if health check fails
        if: failure()
        run: |
          echo "\n--- Last 50 lines of API Gateway simulation log (npm run start) ---"
          # Try to find the most recent log file or process output
          # If using sam local, print .aws-sam/logs or docker logs
          # If using npm run start > file.log, print that file
          # Otherwise, print all node processes
          pgrep -af node || true
          # Try to print docker logs for localstack if relevant
          docker ps -a || true
          docker logs $(docker ps -q --filter ancestor=localstack/localstack:latest) 2>/dev/null || true
          echo "--- End of log output ---\n"
