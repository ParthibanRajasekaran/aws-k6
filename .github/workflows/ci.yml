name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID || 'test' }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY || 'test' }}
      AWS_REGION: us-east-1
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      
      - name: Configure AWS credentials for LocalStack
        run: |
          aws configure set aws_access_key_id test
          aws configure set aws_secret_access_key test  
          aws configure set region us-east-1
          aws configure set output json
      
      - name: Start LocalStack
        uses: LocalStack/setup-localstack@v0.2.2
        with:
          image-tag: 'latest'
          install-awslocal: 'true'
        env:
          DEBUG: 1
          
      - name: Install dependencies
        run: |
          for i in 1 2 3; do
            npm ci && break || {
              echo "npm ci failed (attempt $i), printing npm-debug.log if exists...";
              if [ -f npm-debug.log ]; then cat npm-debug.log; fi;
              if [ $i -eq 3 ]; then exit 1; fi;
              echo "Retrying in 10 seconds...";
              sleep 10;
            }
          done
          
      - name: Create S3 bucket in LocalStack
        run: |
          echo "Waiting for LocalStack to be ready..."
          # Wait for LocalStack to be fully ready
          for i in {1..30}; do
            if curl -s http://localhost:4566/_localstack/health | grep -q '"s3": "available"'; then
              echo "LocalStack is ready!"
              break
            fi
            echo "Waiting for LocalStack... (attempt $i/30)"
            sleep 2
          done
          # Create S3 bucket
          awslocal s3 mb s3://grocery-list-bucket || true
          # Verify bucket was created
          awslocal s3 ls
      - name: Download Karate JAR
        run: |
          curl -L -o karate.jar https://github.com/karatelabs/karate/releases/download/v1.4.1/karate-1.4.1.jar
      - name: Setup AWS SAM CLI and samlocal
        uses: aws-actions/setup-sam@v1
      
      - name: Install samlocal wrapper
        run: |
          pip install aws-sam-cli-local
      - name: Create CI-specific environment file
        run: |
          echo "Creating environment file for CI with correct LocalStack endpoint..."
          cat > env.json << EOF
          {
            "GroceryHandler": {
              "GROCERY_BUCKET": "grocery-list-bucket",
              "AWS_ACCESS_KEY_ID": "test",
              "AWS_SECRET_ACCESS_KEY": "test",
              "AWS_REGION": "us-east-1",
              "AWS_ENDPOINT_URL": "http://localhost:4566",
              "AWS_DEFAULT_REGION": "us-east-1"
            }
          }
          EOF
          cat env.json
          
          # Also create a local .env file for debugging
          cat > .env << EOF
          GROCERY_BUCKET=grocery-list-bucket
          AWS_ACCESS_KEY_ID=test
          AWS_SECRET_ACCESS_KEY=test
          AWS_REGION=us-east-1
          AWS_ENDPOINT_URL=http://localhost:4566
          AWS_DEFAULT_REGION=us-east-1
          EOF
      
      - name: Build SAM application
        run: |
          echo "Building SAM application with samlocal..."
          samlocal build --debug
          echo "SAM build completed"
      
      - name: Start API Gateway simulation and run tests
        run: |
          echo "Starting API Gateway simulation with samlocal..."
          
          # Export environment variables to ensure they're available
          export GROCERY_BUCKET=grocery-list-bucket
          export AWS_ACCESS_KEY_ID=test
          export AWS_SECRET_ACCESS_KEY=test
          export AWS_REGION=us-east-1
          export AWS_DEFAULT_REGION=us-east-1
          
          # Create environment file for samlocal
          cat > env.json << EOF
          {
            "GroceryHandler": {
              "GROCERY_BUCKET": "grocery-list-bucket",
              "AWS_ACCESS_KEY_ID": "test",
              "AWS_SECRET_ACCESS_KEY": "test",
              "AWS_REGION": "us-east-1",
              "AWS_DEFAULT_REGION": "us-east-1"
            }
          }
          EOF
          echo "Environment file contents:"
          cat env.json
          
          # Start the API Gateway simulation using samlocal (which handles LocalStack networking automatically)
          samlocal local start-api --env-vars env.json --port 3000 --host 0.0.0.0 --skip-pull-image &
          SAM_PID=$!
          echo "samlocal process started with PID: $SAM_PID"
          
          # Give the server time to start and check if process is still running
          echo "Sleeping for 25 seconds to allow API simulation to start..."
          sleep 25
          if ps -p $SAM_PID > /dev/null; then
            echo "samlocal process is still running (PID: $SAM_PID)"
          else
            echo "samlocal process died! Checking for errors..."
            docker ps -a
            exit 1
          fi
          
          # Test the health endpoint first
          echo "Testing health endpoint..."
          for i in {1..10}; do
            if curl -f http://localhost:3000/grocery -X GET 2>/dev/null; then
              echo "Health endpoint is responding!"
              break
            fi
            echo "Waiting for health endpoint... (attempt $i/10)"
            sleep 3
          done
          
          # Verify LocalStack is still healthy
          curl -s http://localhost:4566/_localstack/health || {
            echo "LocalStack health check failed!"
            echo "LocalStack logs:"
            docker logs localstack 2>/dev/null || true
            exit 1
          }
          
          # Execute full test suite; test-all.sh includes a wait-for-url step
          ./scripts/test-all.sh
        env:
          AWS_ACCESS_KEY_ID: test
          AWS_SECRET_ACCESS_KEY: test
          AWS_REGION: us-east-1
          AWS_DEFAULT_REGION: us-east-1
          GROCERY_BUCKET: grocery-list-bucket
      - name: Print API Gateway simulation logs if health check fails
        if: failure()
        run: |
          echo "\n--- Last 50 lines of API Gateway simulation log (samlocal) ---"
          # Try to find the most recent log file or process output
          # If using samlocal, print any relevant process information
          pgrep -af sam || true
          pgrep -af python || true
          # Try to print docker logs for LocalStack
          docker ps -a || true
          echo "LocalStack logs:"
          docker logs localstack 2>/dev/null || true
          echo "--- End of log output ---\n"
