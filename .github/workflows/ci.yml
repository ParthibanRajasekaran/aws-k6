name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID || 'test' }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY || 'test' }}
      AWS_REGION: us-east-1
    services:
      localstack:
        image: localstack/localstack:latest
        ports:
          - 4566:4566
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: |
          for i in 1 2 3; do
            npm ci && break || {
              echo "npm ci failed (attempt $i), printing npm-debug.log if exists...";
              if [ -f npm-debug.log ]; then cat npm-debug.log; fi;
              if [ $i -eq 3 ]; then exit 1; fi;
              echo "Retrying in 10 seconds...";
              sleep 10;
            }
          done
      - name: Start LocalStack and create S3 bucket
        run: |
          aws --endpoint-url=http://localhost:4566 s3 mb s3://grocery-list-bucket || true
      - name: Download Karate JAR
        run: |
          curl -L -o karate.jar https://github.com/karatelabs/karate/releases/download/v1.4.1/karate-1.4.1.jar
      - name: Install AWS SAM CLI
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip curl
          curl -Lo aws-sam-cli-linux-x86_64.zip https://github.com/aws/aws-sam-cli/releases/latest/download/aws-sam-cli-linux-x86_64.zip
          unzip aws-sam-cli-linux-x86_64.zip -d sam-installation
          sudo ./sam-installation/install
          rm -rf aws-sam-cli-linux-x86_64.zip sam-installation
      - name: Start API Gateway simulation (SAM/LocalStack)
        run: |
          npm run start:ci > sam-local.log 2>&1 &
          sleep 5
          echo "--- sam-local.log initial output ---"
          head -40 sam-local.log || true
          echo "--- end sam-local.log initial output ---"
      - name: List running processes (debug)
        run: |
          echo "\n--- Running processes after starting API Gateway simulation ---"
          ps aux
          echo "--- End of process list ---\n"
      - name: Run all tests (unit, direct lambda, acceptance, performance)
        run: ./scripts/test-all.sh
      - name: Print API Gateway simulation logs if health check fails
        if: failure()
        run: |
          echo "\n--- Last 50 lines of API Gateway simulation log (npm run start) ---"
          # Try to find the most recent log file or process output
          # If using sam local, print .aws-sam/logs or docker logs
          # If using npm run start > file.log, print that file
          # Otherwise, print all node processes
          pgrep -af node || true
          # Try to print docker logs for localstack if relevant
          docker ps -a || true
          docker logs $(docker ps -q --filter ancestor=localstack/localstack:latest) 2>/dev/null || true
          echo "--- End of log output ---\n"
