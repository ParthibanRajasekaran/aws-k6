name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID || 'test' }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY || 'test' }}
      AWS_REGION: us-east-1
    services:
      localstack:
        image: localstack/localstack:latest
        ports:
          - 4566:4566
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: |
          for i in 1 2 3; do
            npm ci && break || {
              echo "npm ci failed (attempt $i), printing npm-debug.log if exists...";
              if [ -f npm-debug.log ]; then cat npm-debug.log; fi;
              if [ $i -eq 3 ]; then exit 1; fi;
              echo "Retrying in 10 seconds...";
              sleep 10;
            }
          done
      - name: Start LocalStack and create S3 bucket
        run: |
          aws --endpoint-url=http://localhost:4566 s3 mb s3://grocery-list-bucket || true
      - name: Download Karate JAR
        run: |
          curl -L -o karate.jar https://github.com/karatelabs/karate/releases/download/v1.4.1/karate-1.4.1.jar
      - name: Setup AWS SAM CLI
        uses: aws-actions/setup-sam@v1
      - name: Create CI-specific environment file
        run: |
          echo "Creating environment file for CI with correct LocalStack endpoint..."
          cat > env.json << EOF
          {
            "GroceryHandler": {
              "GROCERY_BUCKET": "grocery-list-bucket",
              "AWS_ACCESS_KEY_ID": "test",
              "AWS_SECRET_ACCESS_KEY": "test",
              "AWS_REGION": "us-east-1",
              "AWS_ENDPOINT_URL": "http://localhost:4566"
            }
          }
          EOF
          cat env.json
      
      - name: Build SAM application
        run: |
          echo "Building SAM application..."
          sam build --debug
          echo "SAM build completed"
      
      - name: Start API Gateway simulation and run tests
        run: |
          echo "Starting API Gateway simulation in background..."
          # Start the API Gateway simulation in background without using & to prevent job termination
          # npm run start:ci will use SAM CLI to start the API gateway locally
          npm run start:ci &
          SAM_PID=$!
          echo "SAM process started with PID: $SAM_PID"
          # Give the server time to start and check if process is still running
          echo "Sleeping for 15 seconds to allow API simulation to start..."
          sleep 15
          if ps -p $SAM_PID > /dev/null; then
            echo "SAM process is still running (PID: $SAM_PID)"
          else
            echo "SAM process died! Checking for errors..."
            # Try to see if there are any docker containers
            docker ps -a
            exit 1
          fi
          # Execute full test suite; test-all.sh includes a wait-for-url step
          ./scripts/test-all.sh
        env:
          AWS_ENDPOINT_URL: http://localhost:4566
      - name: Print API Gateway simulation logs if health check fails
        if: failure()
        run: |
          echo "\n--- Last 50 lines of API Gateway simulation log (npm run start) ---"
          # Try to find the most recent log file or process output
          # If using sam local, print .aws-sam/logs or docker logs
          # If using npm run start > file.log, print that file
          # Otherwise, print all node processes
          pgrep -af node || true
          # Try to print docker logs for localstack if relevant
          docker ps -a || true
          docker logs $(docker ps -q --filter ancestor=localstack/localstack:latest) 2>/dev/null || true
          echo "--- End of log output ---\n"
