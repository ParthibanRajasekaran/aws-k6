version: '3.8'

services:
  localstack:
    image: localstack/localstack:3.0
    ports:
      - "4566:4566"
    environment:
      - SERVICES=lambda,s3,iam,logs
      - DEFAULT_REGION=us-east-1
      - DEBUG=0
      - LS_LOG=warn
      - LAMBDA_EXECUTOR=local
      - PERSISTENCE=false
      - DOCKER_HOST=unix:///var/run/docker.sock
      - LAMBDA_RUNTIME_ENVIRONMENT_TIMEOUT=30
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock"
      - "./localstack-s3-data:/var/lib/localstack"
    networks:
      - lambda_s3_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4566/_localstack/health"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 20s

  api-gateway:
    build:
      context: .
      dockerfile: Dockerfile.api
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - LOCALSTACK_HOST=localstack
      - BUCKET=lambda-s3-test-bucket
      - AWS_REGION=us-east-1
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
      - AWS_ENDPOINT_URL=http://localstack:4566
    volumes:
      - ./lambda:/app/lambda:ro
      - ./k6:/app/k6:ro
      - ./reports:/app/reports
    depends_on:
      localstack:
        condition: service_healthy
    networks:
      - lambda_s3_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 15s

  k6-runner:
    image: grafana/k6:latest
    volumes:
      - ./k6:/scripts:ro
      - ./reports:/reports
      - ./config:/config:ro
    depends_on:
      api-gateway:
        condition: service_healthy
    networks:
      - lambda_s3_network
    profiles:
      - testing

networks:
  lambda_s3_network:
    driver: bridge

volumes:
  localstack_data:
    driver: local
